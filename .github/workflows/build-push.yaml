name: Build and Push Website to GHCR

on:
  push:
    branches:
      - main # Change to 'master' if that is your default branch name

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # This grants the workflow permission to upload to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # This token is automatically generated by GitHub Actions, no PAT needed!
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags the image as 'latest' and also attaches the Git commit hash for version control
          tags: |
            ghcr.io/shavedcloaca/jessamine-farm:latest
            ghcr.io/shavedcloaca/jessamine-farm:${{ github.sha }}